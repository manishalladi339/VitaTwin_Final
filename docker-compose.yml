version: '3.9'
services:
  backend:
    build: ./backend
    container_name: vitatwin-backend
    ports: ["8000:8000"]
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_URI=${MONGODB_URI}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=http://localhost:5173
    depends_on: [mongo]
  frontend:
    image: node:20-slim
    working_dir: /app
    container_name: vitatwin-frontend
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on: [backend]
  mongo:
    image: mongo:6
    container_name: vitatwin-mongo
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  mongo_data:
